<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<title>Insurance Calculator (Auto Currency)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#eef1f5;
  --card:#ffffff;
  --text:#0f172a;
  --header:#111827;
  --header-text:#f9fafb;
  --border:#cbd5e1;
}
body.dark{
  --bg:#020617;
  --card:#0f172a;
  --text:#e5e7eb;
  --header:#000000;
  --header-text:#f9fafb;
  --border:#475569;
}

*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
}

header{
    background:var(--header);
    color:var(--header-text);
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:12px;
}
header h1{
    font-size:18px;
    margin:0;
    font-weight:700;
}
header .spacer{ flex:1; }
header button{
    padding:6px 10px;
    border:none;
    border-radius:999px;
    background:#334155;
    color:#e5e7eb;
    cursor:pointer;
    font-size:13px;
}

.container{
    max-width:1200px;
    margin:0 auto;
    padding:16px;
    display:flex;
    gap:16px;
    flex-wrap:wrap;
}

.card{
    background:var(--card);
    border-radius:12px;
    border:1px solid var(--border);
    padding:16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.18);
    flex:1 1 360px;
    min-width:320px;
}

h2{
    margin:0 0 10px 0;
    font-size:18px;
}
label{
    display:block;
    font-size:12px;
    font-weight:600;
    margin-top:8px;
}

input, select, textarea{
    width:100%;
    padding:8px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    font-size:13px;
}

textarea{
    min-height:130px;
    resize:vertical;
    font-family:Consolas, monospace;
}

button.action{
    width:100%;
    padding:9px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-weight:700;
    cursor:pointer;
    font-size:14px;
}
button.action:hover{ background:#1d4ed8; }

.row{ display:flex; gap:10px; }
.row > div{ flex:1; }

.value{ font-weight:700; }
.green{ color:#22c55e; }
.red{ color:#ef4444; }

/* Aiškūs checkbox'ai */
.checkbox-clean {
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:10px;
    background:rgba(0,0,0,0.04);
    border-radius:8px;
    border:1px solid var(--border);
}
.checkbox-clean label {
    font-size:13px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:6px;
}
.checkbox-clean input[type="checkbox"] {
    width:16px;
    height:16px;
}

.pdf-controls{
    margin-top:12px;
    display:flex;
    gap:8px;
    align-items:center;
    font-size:12px;
}
.pdf-controls select{
    width:auto;
    min-width:140px;
}

/* Naujas mėlynas "Naujas skaičiavimas" mygtukas */
.clear-row{
    margin-top:8px;
    text-align:right;
}
button.clear-btn{
    padding:6px 14px;
    border:none;
    border-radius:999px;
    background:#2563eb;
    color:#ffffff;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
}
button.clear-btn:hover{
    background:#1d4ed8;
}

@media print{
    body{ background:#ffffff; color:#000000; }
    header, .pdf-controls{ display:none !important; }
    .card{ box-shadow:none; border:1px solid #e5e7eb; }
    body.pdf-calc #clientCard{ display:none !important; }
    body.pdf-client #calcCard{ display:none !important; }
    body.pdf-both #calcCard, body.pdf-both #clientCard{ display:block !important; }
}

.signature{
    text-align:center;
    color:#888;
    font-size:12px;
    margin-top:25px;
    margin-bottom:20px;
}
</style>
</head>

<body>

<header>
    <h1>Insurance Calculator (Auto Currency)</h1>
    <div class="spacer"></div>
    <button onclick="toggleDark()">🌙 / ☀️</button>
</header>

<div class="container">

    <!-- SKAIČIUOKLĖ -->
    <div class="card" id="calcCard">
        <h2>Skaičiuoklė</h2>

        <label>Invoice valiuta</label>
        <select id="invoiceCurrency">
            <option>USD</option>
            <option>EUR</option>
            <option>GBP</option>
            <option>PLN</option>
            <option>CAD</option>
            <option>AUD</option>
            <option>CHF</option>
            <option>CNY</option>
        </select>

        <label>Invoice suma (ta valiuta)</label>
        <input type="number" id="invoiceAmount" placeholder="pvz. 625000">

        <label>Invoice suma EUR (automatiškai per ECB)</label>
        <input type="number" id="invoiceEUR" readonly style="background:#e2e8f0;">
        <div id="rateStatus" style="margin-top:6px;font-size:12px;min-height:16px;color:#16a34a;"></div>

        <!-- Naujas mygtukas -->
        <div class="clear-row">
            <button type="button" class="clear-btn" onclick="resetAll()">Naujas skaičiavimas</button>
        </div>

        <div class="row">
            <div>
                <label>Brokerio %</label>
                <select id="brokerPercent">
                    <option value="0.07">0,07 %</option>
                    <option value="0.08">0,08 %</option>
                    <option value="0.10">0,10 %</option>
                    <option value="0.12">0,12 %</option>
                    <option value="custom">Kitas</option>
                </select>
            </div>
            <div>
                <label>Brokerio % (jei Kitas)</label>
                <input type="text" id="brokerCustom" placeholder="pvz. 0,09" disabled>
            </div>
        </div>

        <div class="row">
            <div>
                <label>Tavo % klientui</label>
                <select id="myPercent">
                    <option value="0.23">0,23 %</option>
                    <option value="0.24" selected>0,24 %</option>
                    <option value="0.25">0,25 %</option>
                    <option value="custom">Kitas</option>
                </select>
            </div>
            <div>
                <label>Tavo % (jei Kitas)</label>
                <input type="text" id="myCustom" placeholder="pvz. 0,27" disabled>
            </div>
        </div>

        <button class="action" onclick="calc()">Skaičiuoti</button>

        <h3>Rezultatai</h3>
        <p>Invoice EUR: <span id="resInvoiceEUR" class="value">–</span></p>
        <p>Savikaina (brokeris): <span id="resCost" class="value">–</span></p>
        <p>Kaina klientui: <span id="resClient" class="value">–</span></p>
        <p>Pelnas: <span id="resProfit" class="value">–</span></p>

        <h4>AON vs Legator palyginimui</h4>
        <p>AON 0,07 %: <span id="resAON" class="value">–</span></p>
        <p>Legator 0,10 %: <span id="resLeg" class="value">–</span></p>
    </div>

    <!-- KLIENTO TEKSTAS -->
    <div class="card" id="clientCard">
        <h2>Tekstas klientui</h2>

        <label>Kalba / Language</label>
        <select id="lang">
            <option value="LT">Lietuvių</option>
            <option value="EN">English</option>
            <option value="RU">Русский</option>
        </select>

        <label style="margin-bottom:6px; display:block; font-weight:700;">Ką rodyti klientui?</label>

        <div class="checkbox-clean">
            <label><input type="checkbox" id="showEUR" checked> Rodyti kainą EUR</label>
            <label><input type="checkbox" id="showExtra" checked> Rodyti papildomą valiutą</label>
            <label><input type="checkbox" id="showDate" checked> Rodyti datą</label>
            <label><input type="checkbox" id="showInvoice" checked> Rodyti invoice eilutę</label>
        </div>

        <label>Pasirink papildomą valiutą</label>
        <select id="extraCurrency">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="PLN">PLN</option>
            <option value="CAD">CAD</option>
            <option value="AUD">AUD</option>
            <option value="CHF">CHF</option>
            <option value="CNY">CNY</option>
        </select>

        <button class="action" onclick="generateClientText()">Generuoti tekstą klientui</button>

        <label>Tekstas klientui</label>
        <textarea id="clientText"></textarea>

        <button class="action" onclick="copyClientText()">Kopijuoti tekstą</button>

        <div class="pdf-controls">
            <span>PDF turinys:</span>
            <select id="pdfMode">
                <option value="both">Skaičiuoklė + tekstas</option>
                <option value="calc">Tik skaičiuoklė</option>
                <option value="client">Tik tekstas klientui</option>
            </select>
            <button onclick="generatePDF()" style="width:auto;padding:6px 10px;">PDF (Print)</button>
        </div>
    </div>
</div>

<script>
let lastClientEUR=null;
let requestId=0;
const rateCache=new Map();
const supported=new Set(["EUR","USD","GBP","PLN","CAD","AUD","CHF","CNY"]);

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("dark",document.body.classList.contains("dark"));
}
if(localStorage.getItem("dark")==="true") document.body.classList.add("dark");

function num(v){return Number(String(v).trim().replace(",","."));}
function status(msg,error=false){
  const el=document.getElementById("rateStatus");
  el.textContent=msg;
  el.style.color=error?"#ef4444":"#16a34a";
}
function csv(line){
  const out=[]; let cur="",q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){
      if(q&&line[i+1]==='"'){cur+='"';i++;} else q=!q;
    }else if(c===","&&!q){out.push(cur);cur="";} else cur+=c;
  }
  out.push(cur); return out;
}
async function getEcbRate(currency){
  if(currency==="EUR") return {rate:1,date:null};
  if(!supported.has(currency)) throw new Error("Nepalaikoma valiuta");
  if(rateCache.has(currency)) return rateCache.get(currency);
  const url=`https://data-api.ecb.europa.eu/service/data/EXR/D.${currency}.EUR.SP00.A?format=csvdata&lastNObservations=1`;
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok) throw new Error(`ECB HTTP ${r.status}`);
  const lines=(await r.text()).replace(/^\uFEFF/,"").split(/\r?\n/).filter(x=>x.trim());
  if(lines.length<2) throw new Error("Tuščias ECB atsakymas");
  const h=csv(lines[0]),v=csv(lines[lines.length-1]);
  const ri=h.indexOf("OBS_VALUE"),di=h.indexOf("TIME_PERIOD");
  if(ri<0||di<0) throw new Error("Netikėtas ECB formatas");
  const rate=Number(v[ri]),date=v[di];
  if(!Number.isFinite(rate)||rate<=0||!date) throw new Error("Blogas ECB kursas");
  const result={rate,date}; rateCache.set(currency,result); return result;
}
async function autoConvert(){
  const id=++requestId;
  const cur=document.getElementById("invoiceCurrency").value;
  const amount=num(document.getElementById("invoiceAmount").value);
  const out=document.getElementById("invoiceEUR");
  lastClientEUR=null;
  document.getElementById("clientText").value="";
  if(!Number.isFinite(amount)||amount<=0){out.value="";status("");return false;}
  if(cur==="EUR"){
    out.value=amount.toFixed(2);
    status("Valiutos keitimas nereikalingas: 1 EUR = 1 EUR");
    return true;
  }
  out.value="";status("Gaunamas ECB kursas...");
  try{
    const {rate,date}=await getEcbRate(cur);
    if(id!==requestId) return false;
    out.value=(amount/rate).toFixed(2);
    status(`ECB kursas (${date}): 1 EUR = ${rate.toFixed(4)} ${cur}`);
    return true;
  }catch(e){
    if(id!==requestId) return false;
    out.value="";status("Nepavyko gauti ECB kurso. Patikrink internetą ir bandyk dar kartą.",true);
    console.error(e); return false;
  }
}
document.getElementById("invoiceCurrency").addEventListener("change",autoConvert);
let timer;
document.getElementById("invoiceAmount").addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(autoConvert,250);});

document.getElementById("brokerPercent").addEventListener("change",function(){
  const c=document.getElementById("brokerCustom"); c.disabled=this.value!=="custom"; if(c.disabled)c.value="";
});
document.getElementById("myPercent").addEventListener("change",function(){
  const c=document.getElementById("myCustom"); c.disabled=this.value!=="custom"; if(c.disabled)c.value="";
});
function pct(selectId,customId){
  const s=document.getElementById(selectId).value;
  const p=num(s==="custom"?document.getElementById(customId).value:s);
  return Number.isFinite(p)?p/100:NaN;
}
async function calc(){
  let eur=num(document.getElementById("invoiceEUR").value);
  if(!Number.isFinite(eur)||eur<=0){if(!await autoConvert())return;eur=num(document.getElementById("invoiceEUR").value);}
  const b=pct("brokerPercent","brokerCustom"),m=pct("myPercent","myCustom");
  if(!Number.isFinite(b)||!Number.isFinite(m)){alert("Įvesk procentą teisingu formatu, pvz. 0,30");return;}
  const cost=eur*b,client=eur*m,profit=client-cost; lastClientEUR=client;
  document.getElementById("resInvoiceEUR").textContent=eur.toFixed(2)+" EUR";
  document.getElementById("resCost").textContent=cost.toFixed(2)+" EUR";
  document.getElementById("resClient").textContent=client.toFixed(2)+" EUR";
  const pe=document.getElementById("resProfit"); pe.textContent=profit.toFixed(2)+" EUR"; pe.className="value "+(profit>=0?"green":"red");
  document.getElementById("resAON").textContent=(eur*0.0007).toFixed(2)+" EUR";
  document.getElementById("resLeg").textContent=(eur*0.001).toFixed(2)+" EUR";
  document.getElementById("clientText").value="";
}
async function generateClientText(){
  if(!Number.isFinite(lastClientEUR)||lastClientEUR<=0){alert("Pirmiausia paspausk „Skaičiuoti“");return;}
  const eur=lastClientEUR,showEUR=document.getElementById("showEUR").checked,showExtra=document.getElementById("showExtra").checked;
  const showDate=document.getElementById("showDate").checked,showInvoice=document.getElementById("showInvoice").checked;
  const amount=document.getElementById("invoiceAmount").value,invCur=document.getElementById("invoiceCurrency").value;
  const lang=document.getElementById("lang").value,extraCur=document.getElementById("extraCurrency").value;
  const today=new Date().toISOString().split("T")[0]; let extra=null;
  if(showExtra){try{extra=eur*(await getEcbRate(extraCur)).rate;}catch(e){console.error(e);alert("Nepavyko gauti papildomos valiutos ECB kurso");return;}}
  let out="";
  if(lang==="LT"){
    out+="Siunčiame preliminarią draudimo įmokos kainą pagal pateiktą invoice vertę.\n\n";
    if(showEUR)out+=`• Draudimo kaina: ${eur.toFixed(2)} EUR\n`;
    if(showExtra)out+=`• Suma ${extraCur} pagal šiandienos kursą: ${extra.toFixed(2)} ${extraCur}\n`;
    if(showInvoice&&amount)out+=`• Invoice vertė: ${amount} ${invCur}\n`;
    if(showDate)out+=`• Data: ${today}\n`;
    out+="\nPastaba:\nTai orientacinė įmoka, paskaičiuota pagal invoice vertę ir šiandienos valiutos kursą.\nGalutinė kaina gali skirtis priklausomai nuo poliso išrašymo dienos.\n";
  }else if(lang==="EN"){
    out+="Please find below the preliminary insurance premium calculated based on the provided invoice value.\n\n";
    if(showEUR)out+=`• Insurance price: ${eur.toFixed(2)} EUR\n`;
    if(showExtra)out+=`• Amount in ${extraCur} at today’s rate: ${extra.toFixed(2)} ${extraCur}\n`;
    if(showInvoice&&amount)out+=`• Invoice value: ${amount} ${invCur}\n`;
    if(showDate)out+=`• Date: ${today}\n`;
    out+="\nNote:\nThis is an indicative premium based on the invoice value and current exchange rate.\nThe final amount may vary depending on the policy issuance date.\n";
  }else{
    out+="Ниже указана предварительная стоимость страховой премии, рассчитанная на основе суммы инвойса.\n\n";
    if(showEUR)out+=`• Стоимость страховки: ${eur.toFixed(2)} EUR\n`;
    if(showExtra)out+=`• Сумма в ${extraCur} по текущему курсу: ${extra.toFixed(2)} ${extraCur}\n`;
    if(showInvoice&&amount)out+=`• Сумма инвойса: ${amount} ${invCur}\n`;
    if(showDate)out+=`• Дата: ${today}\n`;
    out+="\nПримечание:\nЭто ориентировочная премия, рассчитанная по сумме инвойса и текущему курсу.\nФактическая стоимость может отличаться в зависимости от даты оформления полиса.\n";
  }
  document.getElementById("clientText").value=out;
}
async function copyClientText(){
  const t=document.getElementById("clientText"); if(!t.value){alert("Nėra teksto kopijavimui");return;}
  try{await navigator.clipboard.writeText(t.value);}catch(e){t.focus();t.select();document.execCommand("copy");}
}
function generatePDF(){
  const m=document.getElementById("pdfMode").value;
  document.body.classList.remove("pdf-calc","pdf-client","pdf-both");
  document.body.classList.add("pdf-"+m); window.print();
}
window.addEventListener("afterprint",()=>document.body.classList.remove("pdf-calc","pdf-client","pdf-both"));
function resetAll(){
  requestId++; document.getElementById("invoiceCurrency").value="USD"; document.getElementById("invoiceAmount").value="";
  document.getElementById("invoiceEUR").value=""; status("");
  document.getElementById("brokerPercent").value="0.07"; document.getElementById("brokerCustom").value=""; document.getElementById("brokerCustom").disabled=true;
  document.getElementById("myPercent").value="0.24"; document.getElementById("myCustom").value=""; document.getElementById("myCustom").disabled=true;
  ["resInvoiceEUR","resCost","resClient","resAON","resLeg"].forEach(id=>document.getElementById(id).textContent="–");
  const pe=document.getElementById("resProfit"); pe.textContent="–"; pe.className="value";
  document.getElementById("lang").value="LT"; ["showEUR","showExtra","showDate","showInvoice"].forEach(id=>document.getElementById(id).checked=true);
  document.getElementById("extraCurrency").value="USD"; document.getElementById("clientText").value=""; document.getElementById("pdfMode").value="both";
  lastClientEUR=null;
}
</script>


<div class="signature">© Donatas</div>

</body>
</html>
